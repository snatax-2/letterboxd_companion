name: CI

# Tourne à chaque push et à chaque pull request, sur toutes les branches.
# But : détecter une erreur (JSON invalide, syntaxe JS cassée, app.js désynchronisé
# de src/...) AVANT que Vercel ne tente de déployer, plutôt que de le découvrir
# après coup sur le site en ligne.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifications avant déploiement
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installation de Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Validation des fichiers JSON (package.json, manifest.json, vercel.json)
        run: |
          for f in package.json manifest.json vercel.json; do
            echo "→ $f"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"
          done

      # app.js n'est plus commité (voir .gitignore) : c'est un artefact
      # entièrement dérivé de src/, construit ici comme sur Vercel. L'ancienne
      # étape "Vérifie que app.js est synchronisé avec src/" n'a plus lieu
      # d'être — c'est elle qui bloquait tout le reste du CI depuis le 13 août,
      # parce qu'une version minifiée de app.js avait été commitée.
      - name: Construction de app.js depuis src/
        run: node scripts/build-app-js.js

      - name: Budgets de performance (gzip et DOM initial)
        run: npm run quality:budgets

      - name: Vérification de la syntaxe de tous les fichiers JavaScript
        run: |
          status=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*"); do
            if ! node --check "$f"; then
              echo "❌ Erreur de syntaxe : $f"
              status=1
            fi
          done
          exit $status

      - name: Lint (doublons de fonctions/clés — les bugs silencieux du projet)
        run: npm run lint

      - name: Vérifie que app.js s'exécute sans erreur (DOM simulé)
        run: npm run check:load

      - name: Tests automatisés (calcul du score, fusion cloud, rate limiting)
        run: npm test

      - name: Installation des navigateurs Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout (vrai navigateur, gestes tactiles réels)
        run: npm run test:e2e

      - name: Sauvegarde du rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Génération du hash de cache du service worker (sw.js)
        run: node scripts/generate-sw-cache.js

      - name: Résumé
        if: success()
        run: echo "✅ Toutes les vérifications sont passées, Vercel peut déployer."
